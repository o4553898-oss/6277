<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trusteeship - 官方網站</title>
  <style>
    :root {
      --bg-dark: #0d0d0f;
      --card-bg: #16171b;
      --card-border: #2a2b32;
      --accent-red: #e63946;
      --accent-red-hover: #ff4d5a;
      --accent-glow: rgba(230, 57, 70, 0.35);
      --discord-blurple: #5865F2;
      --discord-blurple-hover: #4752C4;
      --text-main: #f8f9fa;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 0%, rgba(230, 57, 70, 0.15) 0%, transparent 60%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      max-width: 720px;
      width: 100%;
    }

    /* 頂部主視覺區 */
    .hero {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 48px 32px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(34, 197, 94, 0.12);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 8px #4ade80;
    }
